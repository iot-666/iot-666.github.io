<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 让手机端正常显示 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>呃呃</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 页面整体样式 */
        body {
            font-family: "Microsoft YaHei", sans-serif;
            line-height: 1.6;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
            color: #333;
        }

        /* 标题样式 */
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #222;
        }

        /* 段落文字样式 */
        p {
            font-size: 16px;
            margin-bottom: 15px;
        }

        /* 图片样式（核心：限制大小 + 完整显示 + 不变形） */
        img {
            /* 限制图片最大宽度 */
            max-width: 100%;
            /* 限制图片最大高度（可自己改） */
            max-height: 500px;
            /* 保持比例，完整显示 */
            object-fit: contain;
            /* 居中显示 */
            display: block;
            margin: 15px auto;
            border-radius: 4px;
        }
    </style>
</head>

<body>
    <!-- 这里放你的标题 -->
    <h1>呃呃</h1>

    <!-- 正文内容（文字 / 图片） -->
    <p>（在此输入正文第一段…）</p>
    <img src="picture/UE.jpg">
    <img src="picture/屏幕截图_2026-02-16_121648_1.png">
    <p>分隔符分割分割</p>

</body>
</html>
