<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 让手机端正常显示 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>做了一个博客编辑器。(千问办公，quanwen3.8)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 页面整体样式 */
        body {
            font-family: "Microsoft YaHei", sans-serif;
            line-height: 1.6;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
            color: #333;
        }

        /* 标题样式 */
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #222;
        }

        /* 段落文字样式 */
        p {
            font-size: 16px;
            margin-bottom: 15px;
        }

        /* 图片样式（核心：限制大小 + 完整显示 + 不变形） */
        img {
            /* 限制图片最大宽度 */
            max-width: 100%;
            /* 限制图片最大高度（可自己改） */
            max-height: 500px;
            /* 保持比例，完整显示 */
            object-fit: contain;
            /* 居中显示 */
            display: block;
            margin: 15px auto;
            border-radius: 4px;
        }
    </style>
</head>

<body>
    <!-- 这里放你的标题 -->
    <h1>做了一个博客编辑器。(千问办公，quanwen3.8)</h1>

    <!-- 正文内容（文字 / 图片） -->
    <p>以前都是手写的html网页，工作很繁琐，现在做了个编辑器，可视化写博客。编辑器右边编辑功能，左边可以实时预览编辑的网页。</p>
    <img src="new-post-4.png">
    <img src="new-post-4_1.png">

</body>
</html>
